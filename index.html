<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020405">
    <title>Orbital Rhythm Instrument</title>
    <link rel="stylesheet" href="styles.css?v=orbitonic-20260520-01">
  </head>
  <body>
    <main class="instrument" aria-label="Orbital rhythm instrument">
      <canvas id="field"></canvas>

      <header class="topbar">
        <div>
          <h1>ORBITONIC</h1>
          <p id="readout">silent field</p>
        </div>
        <div class="top-actions">
          <button id="sampleButton" type="button" aria-label="Current sample">sample</button>
        </div>
      </header>

      <nav class="tools" aria-label="Instrument tools">
        <button class="tool active" type="button" data-tool="planet" title="Planet" aria-label="Draw planet">◌</button>
        <button class="tool" type="button" data-tool="gate" title="Start line" aria-label="Set start line">┃</button>
        <button class="tool" type="button" data-tool="sample" title="Sample" aria-label="Assign sample">◇</button>
        <button class="tool" type="button" data-tool="move" title="Move" aria-label="Move object">↕</button>
        <button class="tool" type="button" data-tool="mute" title="Mute" aria-label="Mute object">◐</button>
        <button class="tool" type="button" data-tool="delete" title="Delete" aria-label="Delete object">×</button>
      </nav>

      <section class="controls" aria-label="System controls">
        <label>
          <span>bpm</span>
          <input id="bpm" type="range" min="45" max="190" step="1" value="112">
        </label>
        <label>
          <span>gravity</span>
          <input id="gravity" type="range" min="0" max="1" step="0.001" value="0.38">
        </label>
        <label>
          <span>chaos</span>
          <input id="chaos" type="range" min="0" max="1" step="0.001" value="0">
        </label>
        <div class="actions">
          <button id="record" type="button">rec</button>
          <button id="stop" type="button">stop</button>
          <button id="clear" type="button">clear</button>
        </div>
      </section>

      <input id="sampleInput" class="hidden-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.aif,.aiff,.ogg">
    </main>

    <script src="app.js?v=orbitonic-20260520-01"></script>
  </body>
</html>
